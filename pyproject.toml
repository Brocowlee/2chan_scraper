[tool.poetry]
name = "2chan-scraper"
version = "0.1.0"
description = "A modular web scraper for 2chan"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
schedule = "^1.2"
python-dotenv = "^1.0"
requests = "^2.31"
beautifulsoup4 = "^4.12"
lxml = "^5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
